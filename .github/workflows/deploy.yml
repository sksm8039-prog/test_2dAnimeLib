name: Build & Deploy SciTech2D to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile to WebAssembly with Pygbag
        run: |
          # Uses the standard default.tmpl bundled on the 0.9.x CDN
          # --ume_block 0 allows immediate execution without waiting for user click
          python -m pygbag --build --ume_block 0 main.py

      - name: Verify Web Output
        run: |
          if [ ! -f "build/web/index.html" ]; then
            echo "Error: build/web/index.html was not generated!"
            exit 1
          fi
          ls -la build/web

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
